<section class="scene">

    <div class="beam"></div>

    <div class="kuck">
        <div class="eye"></div>
    </div>

    <div class="domino">
        <div></div><div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
    </div>

    <div class="orbit-test">
        <div class="orbit-core"></div>
    </div>

    <div class="matrix81">
        <div></div><div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
    </div>

    <div class="edit-diamond">
        <span>strong</span>
        <span>driver</span>
        <span>core</span>
        <span>true</span>
    </div>

</section>

<respo-index id="EDIT" layer="7" class="diamond" avatar="true">

    <!-- IDENTITÄT -->
    <identity core="EDIT‑RESPO"
              signature="EDT‑7‑FND‑DIAMANT"
              version="3.0">
        <pipeline>4‑01‑2</pipeline>
        <superlage>OK NOK FLOW BREAK ECHO VOID ROOT</superlage>
        <sync>NC²□.prime</sync>
        <octa>enabled</octa>
    </identity>

    <!-- STATION -->
    <station>
        <edit-id>EDIT‑FOUNDER‑CORE</edit-id>
        <raw-id>RAW‑FREE‑CORE</raw-id>
        <nc-id>NCpro‑FREE‑CORE</nc-id>
    </station>

    <!-- AVATAR -->
    <avatar>
        <import src="IMport.html" />
        <export src="EXport.html" />
        <port src="EDITport.html" />
    </avatar>

    <!-- ACHSEN -->
    <axis-map>
        <axis name="X" state="flex" />
        <axis name="IX" state="semi‑pure" />
        <axis name="XI" state="high‑active" />
        <axis name="AIR" state="expanding" />
        <axis name="A64" family="active" />
        <axis name="S" state="stable" />
        <axis name="MOVE" state="dynamic" />
        <axis name="STATE" state="open" />
        <axis name="T" state="flow" />
        <axis name="Z" state="vertical" />
    </axis-map>

    <!-- CORE-SYSTEME -->
    <core-systems>
        <octa core="octa.core.json"
              map="octa.map.json"
              panel="octa.panel.json"
              style="octa.style.json" />
        <fusion engine="API‑Fusion‑Matrix.html" />
        <raw module="ANKER.raw" />
        <run8 engine="RUN8" />
        <time engine="time_3x11_scroll_zoom.html" />
        <visual engine="Visualizer.html" />
        <mocca-vector src="mocca.vector"></mocca-vector>
    </core-systems>

    <!-- API-LAYER -->
    <api-layer>
        <api ghost="API.ghost.js" />
        <api raw="API.raw" />
        <api system="API.system.js" />
        <api tech="API‑6E→6D.tech‑Engine.html" />
        <api drift="API‑Meta‑Drift‑Monitor6D.html" />
        <api sync="API‑NC²□.sync‑Visualizer.html" />
    </api-layer>

    <!-- PIPE / LOAD / SAVE -->
    <pipeline-systems>
        <pipe core="PIPE_CORE.js" start="PIPE_START.js" />
        <load core="LOAD_CORE.js"
              map="LOAD_MAP.js"
              pipe="LOAD_PIPE.js"
              start="LOAD_START.js" />
        <save core="SAVE_CORE.js"
              pipe="SAVE_PIPE.js"
              auto="AUTO.js" />
    </pipeline-systems>

    <!-- UP-FAMILY -->
    <up-family>
        <upx id="UPX"
             geo="geo-form-kompatibel-mit-3.csv"
             score="score-bedeutung-3.csv" />
        <upy id="UPY"
             geo="geo-form-kompatibel-mit-3.csv"
             score="score-bedeutung-3.csv" />
        <upz id="UPZ"
             geo="geo-form-kompatibel-mit-3.csv"
             score="score-bedeutung-3.csv" />
    </up-family>

    <!-- TMP -->
    <tmp-layer>
        <tmp core="TMP.respo" />
        <tmp room="tmp/room.html" />
    </tmp-layer>

    <!-- FOUNDER -->
    <founder>
        <impulse>strong</impulse>
        <market>driver</market>
        <innovation>core</innovation>
        <diamond>true</diamond>
    </founder>

</respo-index>
