<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>I HIT U CODE — EDIT Narrativ</title>
<style>

.scene {
    width: 100%;
    height: 100vh;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
}

/* Beam */
.beam {
    width: 80%;
    height: 4px;
    background: linear-gradient(90deg, #ffcc66, #ffeeaa, #ffcc66);
    animation: beam-move 3s infinite linear;
}
@keyframes beam-move {
    from { transform: translateX(-20%); }
    to   { transform: translateX(20%); }
}

/* Kuck-Kucks */
.kuck {
    width: 80px;
    height: 80px;
    background: #222;
    border-radius: 50%;
    position: relative;
    animation: peek 4s infinite;
}
.eye {
    width: 20px;
    height: 20px;
    background: #ffcc66;
    border-radius: 50%;
    position: absolute;
    top: 30px;
    left: 30px;
}
@keyframes peek {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* Domino */
.domino {
    display: flex;
    gap: 6px;
}
.domino div {
    width: 20px;
    height: 40px;
    background: #333;
    border-radius: 4px;
    animation: fall 1.2s ease-in-out forwards;
}
@keyframes fall {
    0% { transform: translateY(-40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

/* Orbit */
.orbit-test {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 2px solid #444;
    position: relative;
    animation: spin 6s linear infinite;
}
.orbit-core {
    width: 20px;
    height: 20px;
    background: #ffcc66;
    border-radius: 50%;
    position: absolute;
    top: 90px;
    left: 90px;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

/* Matrix81 */
.matrix81 {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 4px;
    width: 360px;
}
.matrix81 div {
    width: 36px;
    height: 36px;
    background: #222;
    border-radius: 4px;
    animation: fall 1.2s ease-in-out forwards;
}

/* EDIT Diamant */
.edit-diamond {
    width: 160px;
    height: 160px;
    background: linear-gradient(45deg, #ffcc66, #ffeeaa);
    transform: rotate(45deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-family: monospace;
    color: #333;
    animation: pulse 2s infinite;
    gap: 4px;
}
@keyframes pulse {
    0% { transform: rotate(45deg) scale(1); }
    50% { transform: rotate(45deg) scale(1.1); }
    100% { transform: rotate(45deg) scale(1); }
}

</style>
</head>

<body>

<section class="scene">

    <div class="beam"></div>

    <div class="kuck">
        <div class="eye"></div>
    </div>

    <div class="domino">
        <div></div><div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
    </div>

    <div class="orbit-test">
        <div class="orbit-core"></div>
    </div>

    <div class="matrix81">
        <div></div><div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
    </div>

    <div class="edit-diamond">
        <span>strong</span>
        <span>driver</span>
        <span>core</span>
        <span>true</span>
    </div>

</section>

<section class="narrativ">
